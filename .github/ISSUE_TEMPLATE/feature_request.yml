name: Feature request
description: Suggest an idea or improvement for Taskly
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is **public**, so please don't include personal data (names, emails, task contents).
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      placeholder: "I often ... but I can't ..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea (optional)
      description: How could Taskly help?
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: My request contains no personal info.
          required: true
