name: Bug report
description: Something in Taskly isn't working as expected
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Taskly! This repository is **public**, so please don't include personal data (names, emails, task contents) in text or screenshots.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See error
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Find it in Taskly under Settings → About.
      placeholder: e.g. 1.2.3
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Platform, OS version and device
      placeholder: e.g. iOS 18, iPhone 15 / Android 14, Pixel 8
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots or screen recordings (optional)
      description: Drag files here. Remove or blur anything personal first.
  - type: textarea
    id: context
    attributes:
      label: Anything else? (optional)
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: I removed personal info (names, emails, task contents) from text and screenshots.
          required: true
